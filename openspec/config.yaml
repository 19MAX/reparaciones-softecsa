# OpenSpec SDD Configuration — reparaciones-softecsa
# Generated by sdd-init

schema: spec-driven

context: |
  Tech stack: PHP 8.1+, CodeIgniter 4.0, composer-based
  Architecture: Standard CodeIgniter 4 app structure (Controllers, Models, Config, Views, Libraries, Services, Filters, Helpers, Language, Database, ThirdParty)
  Testing: PHPUnit 10.5.16 with CIUnitTestCase, coverage enabled (clover/html/php/text)
  Style: PSR-4 autoloading, namespaced App\ and Config\ namespaces

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing CodeIgniter 4 patterns and conventions
  verify:
    - Run composer test or ./vendor/bin/phpunit before marking tasks done
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: true
  test_command: "./vendor/bin/phpunit"
  test_command_alias: "composer test"
  framework: "phpunit"
  version: "10.5.16"

  layers:
    unit:
      available: true
      tool: "CIUnitTestCase"
      path: "tests/unit/"
    integration:
      available: true
      tool: "CIUnitTestCase + Database freshener"
      path: "tests/database/"
    e2e:
      available: false
      tool: "—"

  coverage:
    available: true
    command: "./vendor/bin/phpunit --coverage-text"
    formats:
      - clover: "build/logs/clover.xml"
      - html: "build/logs/html/"
      - php: "build/logs/coverage.serialized"
      - text: "php://stdout"

  quality:
    linter:
      available: false
      tool: "—"
    type_checker:
      available: false
      tool: "—"
    formatter:
      available: false
      tool: "—"

persistence:
  mode: openspec
  artifact_store: openspec
  created: "2026-06-03"
